name: Build Termux Tool

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'customizations/**'
      - '.github/workflows/termuxtool_build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Termux Tool
        uses: actions/checkout@v4

      - name: Checkout Termux Packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: 5a6d1c1eb868795dce83a6c269387b9f82d21805
          path: termux-packages

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Apply customizations
        shell: bash
        run: |
          set -euo pipefail

          cd termux-packages

          git apply ../customizations/properties.patch
          git apply ../customizations/0001-money-prompt.patch
          git apply ../customizations/0002-fix-bootstrap-cleanup.patch

          cp ../customizations/termux-tools/*.patch \
            packages/termux-tools/

          git diff --check

      - name: Build customized ARM64 Bootstrap
        shell: bash
        run: |
          set -euo pipefail

          cd termux-packages

          ./scripts/run-docker.sh \
            bash -c './scripts/setup-android-sdk.sh && ./scripts/build-bootstraps.sh --architectures aarch64 -f'

          test -s bootstrap-aarch64.zip

      - name: Integrate Bootstrap and update checksum
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/cpp

          cp termux-packages/bootstrap-aarch64.zip \
            app/src/main/cpp/bootstrap-aarch64.zip

          HASH=$(sha256sum app/src/main/cpp/bootstrap-aarch64.zip | cut -d ' ' -f 1)

          python3 - "$HASH" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path("app/build.gradle")
          data = path.read_text()
          new_hash = sys.argv[1]

          pattern = r'(downloadBootstrap\("aarch64",\s*")[0-9a-f]{64}(")'
          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + new_hash + m.group(2),
              data,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not update aarch64 checksum")

          path.write_text(updated)
          print("ARM64 Bootstrap SHA256:", new_hash)
          PY

      - name: Build APKs
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Termux-tool-APKs
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: Termux-tool-ARM64-Bootstrap
          path: app/src/main/cpp/bootstrap-aarch64.zip
          if-no-files-found: error
